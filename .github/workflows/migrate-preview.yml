name: Migrate preview database

# W8: previews used to share whatever database their environment pointed at, and
# migrations were run by hand. This gives every pull request its own Neon branch
# and migrates it in CI, so a preview exercises the migration rather than
# assuming it.

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: preview-db-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Secrets are not available to forks; skip rather than fail confusingly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create or reset the Neon branch for this PR
        id: branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: pnpm db:migrate

      - name: Seed demo data
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: pnpm db:seed

      - name: Comment the branch connection details
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-db -->';
            const body = `${marker}\nPreview database ready on Neon branch \`preview/pr-${{ github.event.pull_request.number }}\`, migrated and seeded.\n\nPoint the Vercel preview at it by setting \`DATABASE_URL\` for this deployment.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Delete the PR's Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

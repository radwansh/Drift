name: Migrate production database

# W8 / step 48: the production migration sits behind a manual approval rather
# than running automatically on merge. The `production` environment must have a
# required reviewer configured in repository settings for the gate to mean
# anything — without that, this workflow will run unattended.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the word migrate to confirm
        required: true
        type: string

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation word
        if: inputs.confirm != 'migrate'
        run: |
          echo "Confirmation did not match. Re-run and type: migrate" >&2
          exit 1

  migrate:
    needs: guard
    runs-on: ubuntu-latest
    # The approval gate. Must match the EXISTING environment name exactly — the
    # repo's is "Production". Naming a non-existent environment here makes
    # GitHub create it on first run with no required reviewers, which silently
    # removes the gate this workflow exists to provide.
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fail here rather than inside drizzle-kit. `PRODUCTION_DATABASE_URL` was
      # unset for months while this workflow looked ready to run, and an empty
      # secret reaches `pnpm db:migrate` as a missing connection string — an
      # error about the migrator rather than about the configuration, raised
      # after a reviewer has already approved the run. The secret belongs to
      # the `Production` environment, so only this job, past the gate, can read
      # it; a job without `environment:` sees an empty string.
      - name: Check the production connection string is configured
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PRODUCTION_DATABASE_URL is not set for the Production environment." >&2
            echo "Set it with: gh secret set PRODUCTION_DATABASE_URL --env Production" >&2
            exit 1
          fi
          echo "Connection string is present."

      - name: Show what will be applied
        run: ls -1 packages/db/src/migrations/*.sql

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Re-run migrations to prove idempotency
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        # A second pass must be a no-op, and this step now fails if it is not.
        #
        # It used to carry `continue-on-error: true`, because migration 0004
        # was not idempotent (finding B2). Step 30 fixed that, and
        # `apps/web/test/harness.test.ts` applies the whole folder three times
        # on every CI run to keep it true. Leaving the flag on would have made
        # this step report success whatever happened — silencing the one check
        # that exists to catch a migration which cannot survive a re-run, on
        # the very run that applies new migrations to production for the first
        # time. drizzle keys `__drizzle_migrations` on a hash of each file, so
        # editing an applied migration makes it run again here.
        run: pnpm db:migrate

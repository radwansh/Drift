name: Migrate production database

# W8 / step 48: the production migration sits behind a manual approval rather
# than running automatically on merge. The `production` environment must have a
# required reviewer configured in repository settings for the gate to mean
# anything — without that, this workflow will run unattended.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the word migrate to confirm
        required: true
        type: string

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation word
        if: inputs.confirm != 'migrate'
        run: |
          echo "Confirmation did not match. Re-run and type: migrate" >&2
          exit 1

  migrate:
    needs: guard
    runs-on: ubuntu-latest
    # The approval gate. Configure required reviewers on this environment.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Show what will be applied
        run: ls -1 packages/db/src/migrations/*.sql

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Re-run migrations to prove idempotency
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        # A second pass must be a no-op. Migration 0004 is NOT idempotent
        # (finding B2) and is step 30's job; until that is fixed this step is
        # expected to fail on a database that has not yet had 0004 applied.
        continue-on-error: true
        run: pnpm db:migrate
